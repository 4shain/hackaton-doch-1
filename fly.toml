# fly.io deploy: single VM running PostGIS + backend + nginx (see fly.Dockerfile)
app = "doch-1"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "fly.Dockerfile"

[env]
  APP_ENV = "development"
  DEV_LOGIN_ENABLED = "true"
  DATABASE_URL = "postgresql+psycopg://doch1@127.0.0.1:5432/doch1"
  TIMEZONE = "Asia/Jerusalem"
  DAILY_JOB_HOUR = "8"
  SCHEDULER_ENABLED = "true"
  SESSION_TTL_HOURS = "12"

[mounts]
  source = "doch1_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
